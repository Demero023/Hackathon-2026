<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a2e1d" />
    <meta
      name="description"
      content="Your Mojela's dashboard — find a trusted Gogo or Auntie for ongoing care of your child."
    />
    <title>Mojela's — Mother Dashboard</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>

  <body>
    <!-- ==================== HEADER ==================== -->
    <header>
      <a href="mother.html" aria-label="Mojela's mother dashboard">
        <h1>Mojela's</h1>
        <p>Mother dashboard</p>
      </a>

      <nav aria-label="Account">
        <a href="index.html" id="logoutBtn">Log out</a>
      </nav>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main>
      <!-- ========== GREETING ========== -->
      <section>
        <h2 id="motherGreeting">Dumela, Lerato</h2>
        <p>
          Looking for a Gogo or Auntie to care for your child while you are at
          work? Find someone you trust for the months ahead.
        </p>
      </section>

      <!-- ========== FIND A CAREGIVER ========== -->
      <section>
        <h2>Find a Gogo or Auntie</h2>

        <form role="search">
          <label for="searchInput">Search by name or town</label>
          <input
            type="search"
            id="searchInput"
            name="q"
            placeholder="e.g. Polokwane"
          />
          <button type="submit">Search</button>
        </form>
        <!-- JS fills this with caregiver cards -->
        <div id="caregiverList"></div>
      </section>

      <!-- ========== MY REQUESTS ========== -->

      <section id="my-requests">
        <h2>My requests</h2>
        <div id="motherRequestList"></div>
      </section>

      <!-- ========== REQUEST MODAL ========== -->
      <div id="requestModal" hidden>
        <div>
          <h2 id="requestModalTitle">Request care</h2>

          <form id="requestForm">
            <label for="reqMessage">Your message</label>
            <textarea
              id="reqMessage"
              rows="4"
              maxlength="300"
              placeholder="Dumela! I return to work in two weeks and need someone to look after my baby for the next 6 months..."
              required
            ></textarea>

            <label for="reqDate">
              Preferred start date <span>(optional)</span>
            </label>
            <input type="date" id="reqDate" />

            <button type="submit">Send request</button>
            <button type="button" id="cancelRequestBtn">Cancel</button>
          </form>
        </div>
      </div>
      <!-- ========== PROFILE ========== -->
      <section>
        <h2>Your profile</h2>

        <dl id="motherProfile">
          <!-- Profile details will be populated here by JavaScript -->
        </dl>
      </section>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer>
      <p>TwoMinds Rosebank hackathon</p>
    </footer>
    <script src="javaScripts/app.js"></script>
    <script src="javaScripts/mother.js"></script>
  </body>
</html>
