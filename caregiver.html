<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7a2e1d" />
    <meta
      name="description"
      content="Your Mojela's dashboard — see ongoing care requests from mothers in your area."
    />
    <title>Mojela's — Gogo Dashboard</title>
    <link rel="stylesheet" href="style/style.css" />
  </head>

  <body>
    <!-- ==================== HEADER ==================== -->
    <header>
      <a href="caregiver.html" aria-label="Mojela's caregiver dashboard">
        <h1>Mojela's</h1>
        <p>Gogo dashboard</p>
      </a>

      <nav aria-label="Account">
        <a href="index.html" id="logoutBtn">Log out</a>
      </nav>
    </header>

    <!-- ==================== MAIN ==================== -->
    <main>
      <!-- ========== GREETING ========== -->
      <section>
        <h2 id="caregiverGreeting">Dumela, Gogo Maria</h2>
        <p>
          Mothers in your area are looking for someone they can trust to care
          for their child for the months ahead. Here are their requests.
        </p>
      </section>

      <!-- ========== NOTIFICATION ========== -->
      <section id="notifications">
        <h2 id="notificationsHeading"></h2>
        <p id="notificationsText"></p>
      </section>

      <!-- ========== REQUESTS FROM MOTHERS ========== -->
      <section>
        <h2>Requests from mothers</h2>
        <div id="requestList"></div>
      </section>
      <!-- ========== PROFILE ========== -->
      <section>
        <h2>Your profile</h2>
        <dl id="caregiverProfile">
          <!-- caregiver.js -->
        </dl>
      </section>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer>
      <p>TwoMinds Rosebank hackathon</p>
    </footer>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="javaScripts/app.js"></script>
    <script src="javaScripts/caregiver.js"></script>
  </body>
</html>
